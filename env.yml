name: bipackage
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - bwa
  - samtools
  - bedtools
  - gatk4
  - openjdk=17 # for gatk4
  - dragmap # dragen-os
  - coreutils  # Includes md5sum
  - bcl2fastq
  - sambamba
  - mosdepth

  # Optional: for managing environment-specific dependencies
  - pip:
      - pandas
      - biopython
      - rich-argparse
      - argcomplete
